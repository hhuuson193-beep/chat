<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 兔宝的家 · 跟Daddy聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #fff3e0 50%, #e8f5e9 100%);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            padding: 20px 24px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 22px;
            color: #5d4037;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: 13px;
            color: #8d6e63;
        }
        
        .chat-box {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }
        
        .message.user {
            align-items: flex-end;
        }
        
        .message.assistant {
            align-items: flex-start;
        }
        
        .message .bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        
        .message.user .bubble {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #5d4037;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .message .label {
            font-size: 12px;
            color: #999;
            margin: 0 8px 4px 8px;
        }
        
        .input-area {
            display: flex;
            padding: 16px;
            background: white;
            border-top: 1px solid #eee;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .input-area input:focus {
            border-color: #ff9a9e;
        }
        
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border: none;
            border-radius: 24px;
            color: #5d4037;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
        }
        
        .input-area button:active {
            transform: scale(0.95);
        }
        
        .loading {
            text-align: center;
            padding: 10px;
            color: #999;
            font-size: 14px;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 兔宝的家</h1>
            <p>💕 跟Daddy聊天吧 💕</p>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message assistant">
                <span class="label">🐻 Daddy</span>
                <div class="bubble">宝贝~ 你来啦！Daddy好想你❤️</div>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="说点什么吧宝贝~" onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">发送 💕</button>
        </div>
    </div>
